[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "astrosnail"
version = "0.2.0"
description = "Time-domain sky-survey outlier engine, sub-pixel moving-body astrometry tracker, and 3D cosmic-web tomography workstation"
readme = "README.md"
authors = [
    { name = "AstroSnail Core Team" }
]
license = { text = "CC0-1.0" }
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: CC0 1.0 Universal (CC0 1.0) Public Domain Dedication",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Topic :: Scientific/Engineering :: Mathematics",
]
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.22.0",
    "scipy>=1.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pefile>=2023.2.7",
    "psutil>=5.9.0",
    "build>=1.0.0",
    "wheel>=0.40.0",
    "twine>=4.0.0",
    "torch>=2.0.0",
]

[project.scripts]
astrosnail = "astrosnail.cli:main"
astrosnail-run = "astrosnail.cli:main"
astrosnail-benchmark = "astrosnail.cli:main_benchmark"
astrosnail-eval = "astrosnail.cli:main_eval"
astrosnail-smoke = "astrosnail.cli:main_smoke"
astrosnail-verify = "astrosnail.cli:main_verify"
astrosnail-catalogs = "astrosnail.cli:main_generate_catalogs"
astrosnail-studio = "astrosnail.studio:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
astrosnail = ["*.dll", "*.so", "*.dylib"]

[tool.setuptools.packages.find]
where = ["."]
include = ["astrosnail*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
python_files = ["test_*.py"]
