[package]
name = "astrosnail_rs"
version = "0.2.0"
edition = "2021"
authors = ["AstroSnail Core Team"]
description = "#![no_std] Rust SIMD and C-ABI library for AstroSnail astrometry and cosmology engine"
license = "CC0-1.0"

[lib]
crate-type = ["cdylib", "rlib", "staticlib"]
doctest = false

[features]
default = ["std"]
std = []

[profile.dev]
panic = "abort"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
